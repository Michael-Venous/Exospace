[project]
name = "exospace"
version = "0.1.0"
description = "Portable AI assistant that sees and controls any computer or phone over one USB-C cable."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31,<3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
# Stand-in backend: drive the machine you're on (MacBook) instead of a target.
local = ["mss>=9.0", "pyautogui>=0.9.54"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools]
packages = ["brain", "brain.agent", "brain.display", "brain.skills"]

[tool.setuptools.package-data]
"brain.display" = ["page.html"]
