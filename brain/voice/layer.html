<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Exospace Voice</title>
<style>
:root{--ink:#f5f5f7;--dim:#8e8e93;--tone:#1c1c1e;--edge:clamp(32px,7vw,140px)}
body{margin:0;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:48px;box-sizing:border-box;
  padding:clamp(32px,6vmin,96px) var(--edge);overflow:hidden;background:#000;color:var(--ink);
  font:500 16px/1.4 -apple-system,"Ubuntu Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer}
/* What you say is the headline. */
main{align-self:center;max-height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#heard{margin:0;max-width:11ch;font-size:clamp(56px,5.8vw,112px);line-height:1;letter-spacing:-.035em;text-wrap:balance}
#heard.long{max-width:16ch;font-size:clamp(40px,3.8vw,72px)}
#heard.longer{max-width:30ch;font-size:clamp(24px,2.4vw,44px)}
body:not(.on,.wait) #said:empty~#live:empty::before{content:"What are we doing today?";color:var(--ink)}
#live,#says{color:var(--dim)}
#says{flex:none;margin-top:.9em;max-width:40ch;min-height:1.3em;font-size:clamp(24px,2vw,36px);letter-spacing:-.01em}
.err{color:#ff6961}
footer{display:flex;align-items:center;gap:28px}
/* The control: a white dot; the dark disc behind it swells with the voice (--lvl, eased in the script). */
#talk{--d:clamp(120px,14vmin,170px);position:relative;isolation:isolate;width:var(--d);height:var(--d);
  padding:0;border-radius:50%;background:none;animation:breathe 4s ease-in-out infinite}
#talk::before,#talk::after{content:"";position:absolute;inset:0;border-radius:50%}
#talk::before{z-index:-1;background:var(--tone);scale:calc(1 + var(--lvl,0) * .6);transition:scale .18s ease-out}
#talk::after{background:#fff}
#talk:focus-visible{outline:3px solid #fff;outline-offset:14px}
/* Waiting on the speech service or the agent: the dot bounces gently. */
.wait #talk{animation:bounce 1.1s cubic-bezier(.45,0,.55,1) infinite}
#hint{flex:1;font-size:clamp(22px,1.8vw,32px);color:var(--dim)}
#hint::after{content:"Hold to talk"}
.on #hint::after{content:"Listening"}
.wait #hint::after{content:"Working on it"}
#describe{padding:8px 16px;border-radius:999px;background:var(--tone);color:var(--dim)}
#describe[aria-pressed=true]{background:#fff;color:#000}
#mics{max-width:30vw;font:inherit;font-size:16px;color:var(--dim);background:var(--tone);border:0;border-radius:999px;
  padding:8px 16px;cursor:pointer}
/* The connected device: its icon follows the live picture's shape (portrait means a phone). */
#device{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--tone)}
#device svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#device .phone,#device.phone .computer{display:none}
#device.phone .phone{display:block}
#device.none svg{stroke:var(--dim)}
#view{position:fixed;inset:0;z-index:2;display:grid;grid-template-rows:100%;place-items:center;background:#000}
#view[hidden]{display:none}
#frame{width:100%;height:100%;object-fit:contain}
#view.empty #frame{display:none}
#view:not(.empty) #nodevice{display:none}
#nodevice{font-size:clamp(32px,3vw,56px);letter-spacing:-.02em;color:var(--dim)}
#back{position:fixed;top:24px;right:24px;padding:16px 32px;border-radius:999px;background:var(--tone);font-size:24px}
/* Orbi keeps the user company on the right: it floats, blinks, and its face follows the page's state. */
#orbi{position:fixed;right:4vw;top:46%;width:clamp(320px,40vw,760px);translate:0 -50%;pointer-events:none;
  animation:float 7s ease-in-out infinite alternate}
#orbi [data-mood]{display:none}
body:not(.on,.wait,.done) #orbi [data-mood=idle],.on #orbi [data-mood=listen],
.wait:not(.on) #orbi [data-mood=work],.done:not(.on,.wait) #orbi [data-mood=done]{display:inline}
#orbi .blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@media (max-aspect-ratio:5/4){#orbi{display:none}}
@keyframes float{to{translate:0 -54%}}
@keyframes blink{0%,94%,100%{scale:1}97%{scale:1 .1}}
@keyframes breathe{50%{scale:1.03}}
@keyframes bounce{0%,100%{translate:0 0;scale:1}40%{translate:0 -12%;scale:.97 1.03}
  70%{translate:0 0;scale:1.04 .96}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<svg id=orbi viewBox="0 0 200 200" aria-hidden=true>
  <ellipse cx="100" cy="108" rx="92" ry="22" transform="rotate(-14 100 108)" fill="none" stroke="#636366" stroke-width="7"/>
  <circle cx="100" cy="100" r="58" fill="#f5f5f7"/>
  <path d="M10.7 130.3A92 22-14 0 0 189.3 85.7" fill="none" stroke="#636366" stroke-width="7" stroke-linecap="round"/>
  <circle cx="68" cy="108" r="7" fill="#d1d1d6"/><circle cx="132" cy="108" r="7" fill="#d1d1d6"/>
  <g data-mood=idle><g class=blink><ellipse cx="81" cy="92" rx="6" ry="8"/><ellipse cx="119" cy="92" rx="6" ry="8"/></g>
    <path d="M88 108Q100 120 112 108" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/></g>
  <g data-mood=listen><ellipse cx="81" cy="90" rx="7" ry="9"/><ellipse cx="119" cy="90" rx="7" ry="9"/>
    <ellipse cx="100" cy="116" rx="7" ry="8"/></g>
  <g data-mood=work><ellipse cx="85" cy="87" rx="6" ry="8"/><ellipse cx="123" cy="87" rx="6" ry="8"/>
    <path d="M92 113h16" stroke="#000" stroke-width="4.5" stroke-linecap="round"/></g>
  <g data-mood=done><path d="M74 94Q81 86 88 94M112 94Q119 86 126 94" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M86 108Q100 124 114 108Z"/></g>
</svg>
<main>
  <p id=heard aria-live=polite><span id=said></span> <span id=live></span></p>
  <div id=says aria-live=polite></div>
</main>
<footer>
  <button id=talk aria-label="Hold to talk" aria-pressed=false></button>
  <span id=hint></span>
  <button id=describe aria-pressed=false>Describe</button>
  <select id=mics aria-label=Microphone></select>
  <button id=device class=none aria-label="Show the connected screen" aria-expanded=false>
    <svg class=computer viewBox="0 0 24 24" aria-hidden=true><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
    <svg class=phone viewBox="0 0 24 24" aria-hidden=true><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>
  </button>
</footer>
<div id=view hidden>
  <img id=frame alt="Live view of the connected device">
  <p id=nodevice>No device connected</p>
  <button id=back>Close</button>
</div>
<script>
let stopListening = null;
const post = (path, body = {}) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body)}).then(r => r.json()).catch(err => ({error: err.message}));
function showError(text) { waiting(false); said.className = "err"; said.textContent = text; }

// Waiting on the speech service or the agent's reply: the orb bounces until it answers (at most 6 s).
let waitTimer;
function waiting(on) {
  document.body.classList.toggle("wait", on);
  clearTimeout(waitTimer);
  if (on) waitTimer = setTimeout(() => waiting(false), 6000);
}

// Mic switcher. Chrome hides device names until the first mic grant, so the list is refilled after it.
async function listMics() {
  const found = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === "audioinput" && d.deviceId && d.deviceId !== "default");
  let saved = ""; try { saved = localStorage.mic || ""; } catch {}
  mics.replaceChildren(new Option("Default microphone", ""),
    ...found.map((d, i) => new Option(d.label || `Microphone ${i + 1}`, d.deviceId)));
  mics.value = found.some(d => d.deviceId === saved) ? saved : "";
}
mics.onchange = () => {
  try { localStorage.mic = mics.value; } catch {}
  if (stopListening) stopListening();
  if (liveMic) { liveMic.getTracks().forEach(t => t.stop()); liveMic = null; }  // the next press opens the new one
};
navigator.mediaDevices.ondevicechange = listMics;
listMics();

// Narration: speak the agent's questions and results, but never over the user. Lines that
// arrive while the mic is open are held and spoken when the user stops, so a confirmation
// question is never lost.
let unspoken = [], doneTimer;
const speak = text => speechSynthesis.speak(new SpeechSynthesisUtterance(text));
new EventSource("/narration").onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.button) return m.button === "down" ? press() : release();  // the Pi's push-to-talk button
  if (m.pcm) return stopListening || play(m.pcm, m.rate);  // never over the user
  const line = m.say || m.show;
  waiting(false);
  document.body.classList.add("done");
  clearTimeout(doneTimer); doneTimer = setTimeout(() => document.body.classList.remove("done"), 4000);
  says.textContent = line;
  if (!m.say) return;
  if (stopListening) unspoken.push(line); else speak(line);
};

// Describe mode: after each request, Gemini Live's spoken description of the screen streams in as
// PCM chunks, queued back to back. Talking cuts it off.
let out, playAt = 0, playing = [];
function play(b64, rate) {
  out ??= new AudioContext();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), pcm = new Int16Array(bytes.buffer);
  const buffer = out.createBuffer(1, pcm.length, rate);
  buffer.getChannelData(0).set(Float32Array.from(pcm, v => v / 32768));
  const source = out.createBufferSource();
  source.buffer = buffer; source.connect(out.destination);
  playAt = Math.max(playAt, out.currentTime);
  source.start(playAt); playAt += buffer.duration;
  playing.push(source); source.onended = () => playing = playing.filter(s => s !== source);
}
function stopAudio() { playing.forEach(s => s.stop()); playing = []; playAt = 0; }
let describing = false; try { describing = localStorage.describe === "1"; } catch {}
async function setDescribe(on) {
  const r = await post("/describe", {on});
  describing = !!r.on;
  describe.setAttribute("aria-pressed", describing);
  try { localStorage.describe = describing ? "1" : ""; } catch {}
}
describe.onclick = () => setDescribe(!describing);
setDescribe(describing);
function speakHeld() { if (unspoken.length) { speak(unspoken.at(-1)); unspoken = []; } }

// Later segments of one hold continue its request ("go to youtube" ... "and search lofi"). One at a time: an
// early "open ..." clause and the words said right after it must reach the agent in order.
let sending = Promise.resolve();
function send(text, continues) {
  sending = sending.then(() => post("/segment", {text, continues})).then(r => { if (r.error) showError(r.error); });
}

// The leading "open ..." clauses of "open chrome, go to youtube and search cats", and what follows them. A clause
// ends at "and", "then", or a comma or full stop with more words after it (a live transcript ends in one).
const OPENER = /^\s*((?:open|launch|go to)\s.+?)(?:[,;.](?=\s+\S)|(?=\s+(?:and|then)\b))[\s,]*(?:(?:and|then)\b[\s,]*)*(.*)$/i;
function openers(text) {
  const clauses = [];
  for (let m; (m = OPENER.exec(text)); text = m[2]) clauses.push(m[1].trim());
  return [clauses, text.trim()];
}

// The mic stays open between presses: opening it took most of the delay before listening.
let liveMic = null;
async function openMic() {
  if (liveMic && liveMic.getTracks().every(t => t.readyState === "live")) return liveMic;
  liveMic = await navigator.mediaDevices.getUserMedia({audio: mics.value ? {deviceId: {exact: mics.value}} : true});
  return liveMic;
}

let starting = false;
async function start() {
  if (starting) return;      // a double tap must not open a second mic session
  starting = true;
  waiting(true);
  speechSynthesis.cancel();  // the user is talking: stop speaking at once
  stopAudio();
  post("/talk");             // barge in on whatever the agent is doing
  let mic;
  try { mic = await openMic(); }
  catch (err) { starting = false; return showError("Microphone blocked: " + err.message); }
  if (!held) { starting = false; waiting(false); return; }  // let go before the mic opened
  listMics();
  const rec = new MediaRecorder(mic), sock = new WebSocket(`ws://${location.hostname}:__WS_PORT__`);
  // Record from the press, not from when the speech service answers: audio waits here until it does,
  // so the first words are neither delayed nor lost.
  const queued = [];
  let ended = false;
  let done = "", sent = false, early = 0;  // early: this segment's "open ..." clauses already sent
  // shortcut: skips sent clauses by count; a final transcript that moves a clause boundary resends or drops one.
  const leftover = text => { if (!early) return text;
    const [clauses, rest] = openers(text);
    return [...clauses.slice(early), rest].filter(Boolean).join(", "); };
  const ctx = new AudioContext(), an = ctx.createAnalyser(), buf = new Uint8Array(512);
  an.fftSize = buf.length;
  ctx.createMediaStreamSource(mic).connect(an);
  let level = 0;  // eased toward the mic's loudness, so the orb swells and settles instead of twitching
  (function tick() {
    if (ctx.state === "closed") return talk.style.removeProperty("--lvl");
    an.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += (v - 128) ** 2;
    level += (Math.min(1, Math.sqrt(sum / buf.length) / 30) - level) * .12;
    talk.style.setProperty("--lvl", level.toFixed(3));
    requestAnimationFrame(tick);
  })();
  stopListening = () => rec.state === "recording" ? rec.stop() : sock.close();
  rec.ondataavailable = e => {
    if (!e.data.size) return;
    if (sock.readyState === 1) sock.send(e.data); else queued.push(e.data);
  };
  rec.onstop = () => { ended = true; if (sock.readyState === 1) sock.send(JSON.stringify({type: "CloseStream"})); };
  rec.start(100);
  starting = false;
  waiting(false);
  document.body.classList.add("on"); talk.setAttribute("aria-pressed", true); talk.ariaLabel = "Listening";
  said.className = ""; said.textContent = ""; live.textContent = "";
  sock.onopen = () => {
    queued.splice(0).forEach(chunk => sock.send(chunk));
    if (ended) sock.send(JSON.stringify({type: "CloseStream"}));
  };
  sock.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type !== "Results") return;
    const words = m.channel.alternatives[0].transcript;
    if (m.is_final && words) done = (done + " " + words).trim();
    if (words) { said.className = ""; said.textContent = done; live.textContent = m.is_final ? "" : words; }
    const shown = (said.textContent + live.textContent).length;
    heard.classList.toggle("long", shown > 80);
    heard.classList.toggle("longer", shown > 120);
    // Each pause ends a segment: send it now so execution starts while the user keeps talking. A leading
    // "open ..." clause goes sooner, once the words after it end it: "Open up Google Chrome and search up
    // YouTube." had no pause after "Chrome", so Chrome waited for the whole sentence.
    const [clauses] = openers(m.is_final ? done : `${done} ${words}`);
    if (m.speech_final) {
      const left = leftover(done);
      if (left) { send(left, sent); sent = true; }
      done = ""; early = 0;
    } else if (clauses.length > early) {
      send(clauses.slice(early).join(", "), sent);
      sent = true; early = clauses.length;
    }
  };
  sock.onclose = e => {
    stopListening = null;
    starting = false;
    if (rec.state !== "inactive") rec.stop();
    ctx.close();
    document.body.classList.remove("on"); talk.setAttribute("aria-pressed", false); talk.ariaLabel = "Hold to talk";
    live.textContent = "";
    speakHeld();
    const left = leftover(done);
    if (left) send(left, sent);
    waiting(sent || !!done);
    // A close after letting go, or once words came back, lost nothing. Still holding: listen again at once.
    if (e.code === 1000 || ended || sent || done) return;
    if (held) return start();
    showError(`Speech service closed (${e.code}). Try again.`);
  };
}
// Push to talk: listen only while the orb or Space is held, so speech meant for someone else is never acted on.
let held = false;
function press() { if (!held && !stopListening) { held = true; start(); } }
function release() { if (held) { held = false; if (stopListening) stopListening(); } }
talk.onpointerdown = e => { talk.setPointerCapture(e.pointerId); press(); };
talk.onpointerup = talk.onpointercancel = release;
addEventListener("keydown", e => { if (e.code === "Space" && e.target !== mics) { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener("keyup", e => { if (e.code === "Space" && e.target !== mics) release(); });
addEventListener("blur", release);  // the keyup goes to another window

// Live view of the connected device: the agent's capture-card frame (/screen.jpg, relayed by this server).
// While closed, a probe every 5 s keeps the device icon current (dim when nothing is connected).
const FRAME_MS = 250;
let viewing = false, loops = 0;  // loops numbers each open; a loop from an earlier open stops
const loadFrame = img => new Promise(done => {
  img.onload = () => done(true); img.onerror = () => done(false);
  img.src = `/screen.jpg?t=${Date.now()}`;
});
function showDevice(ok, img) {
  device.classList.toggle("none", !ok);
  if (ok) device.classList.toggle("phone", img.naturalHeight > img.naturalWidth);
}
async function streamFrames(mine) {
  while (viewing && mine === loops) {
    const ok = await loadFrame(frame);
    showDevice(ok, frame);
    view.classList.toggle("empty", !ok);
    await new Promise(r => setTimeout(r, ok ? FRAME_MS : 1000));
  }
}
function openView(on) {
  if (viewing === on) return;
  viewing = on; view.hidden = !on; device.setAttribute("aria-expanded", on);
  if (on) streamFrames(++loops);
}
device.onclick = () => openView(true);
back.onclick = () => openView(false);
addEventListener("keydown", e => { if (e.key === "Escape") openView(false); });
const probe = new Image(), checkDevice = async () => { if (!viewing) showDevice(await loadFrame(probe), probe); };
checkDevice(); setInterval(checkDevice, 5000);
</script>
