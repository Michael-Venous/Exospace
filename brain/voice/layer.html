<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Exospace Voice</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-content:center;justify-items:center;gap:100px;padding:16px;box-sizing:border-box;
  background:#fff;color:#1d1d1f;font:500 22px/1.4 -apple-system,"Ubuntu Sans",system-ui,sans-serif;text-align:center}
#talk{width:150px;height:150px;padding:0;border:0;border-radius:50%;cursor:pointer;background:none;--glow:125 147 255;
  box-shadow:0 18px 50px rgb(var(--glow)/.35),0 0 0 calc(var(--lvl,0)*36px) rgb(var(--glow)/.12);
  transform:scale(calc(1 + var(--lvl,0)*.55));transition:transform 90ms ease-out,box-shadow 90ms ease-out;animation:breathe 4s ease-in-out infinite}
#talk:focus-visible{outline:2px solid #7d93ff;outline-offset:8px}
#talk canvas{display:block;width:100%;height:100%}
#heard{max-width:min(640px,90vw);min-height:2.8em;margin:0}
#live,#says{color:#86868b}
#said:empty~#live:empty::before{content:"Hold to talk";color:#a1a1a6}
#says{font-size:18px;min-height:1.2em;max-width:min(640px,90vw)}
.err{color:#d70015}
#mics,#log{position:fixed;font:inherit;font-size:15px;color:#86868b;background:none;border:0;cursor:pointer}
#mics{bottom:16px;left:50%;translate:-50%;max-width:calc(100vw - 32px)}
#log{top:16px;right:16px}
#log[aria-expanded=true]{color:#1d1d1f}
/* Log open: it takes the room left under the transcript, clear of the mic switcher. */
.log{height:100vh;align-content:stretch;grid-template-rows:auto auto auto minmax(320px,1fr);gap:32px;padding-bottom:48px}
#trace{display:none;width:min(900px,calc(100vw - 32px));height:100%;border:1px solid #e5e5ea;border-radius:14px}
.log #trace{display:block}
@keyframes breathe{50%{scale:1.04}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<button id=talk aria-label="Hold to talk" aria-pressed=false><canvas></canvas></button>
<p id=heard aria-live=polite><span id=said></span> <span id=live></span></p>
<div id=says aria-live=polite></div>
<iframe id=trace title="Decision log" data-src="__AGENT__/#log"></iframe>
<select id=mics aria-label=Microphone></select>
<button id=log aria-expanded=false>Decision log</button>
<script>
let stopListening = null;
const post = (path, body = {}) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body)}).then(r => r.json()).catch(err => ({error: err.message}));
function showError(text) { said.className = "err"; said.textContent = text; }

// Mic switcher. Chrome hides device names until the first mic grant, so the list is refilled after it.
async function listMics() {
  const found = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === "audioinput" && d.deviceId && d.deviceId !== "default");
  let saved = ""; try { saved = localStorage.mic || ""; } catch {}
  mics.replaceChildren(new Option("Default microphone", ""),
    ...found.map((d, i) => new Option(d.label || `Microphone ${i + 1}`, d.deviceId)));
  mics.value = found.some(d => d.deviceId === saved) ? saved : "";
}
mics.onchange = () => { try { localStorage.mic = mics.value; } catch {} if (stopListening) stopListening(); };
navigator.mediaDevices.ondevicechange = listMics;
listMics();

// Decision log: the agent's display shows its history and step decisions under the transcript.
log.onclick = () => {
  trace.src ||= trace.dataset.src;  // connect to the agent only once opened
  log.setAttribute("aria-expanded", document.body.classList.toggle("log"));
};

// The orb: a lit sphere drawn per pixel, so it can turn. It drifts slowly, turns red while it
// listens and spins fast in purple while the agent works; its glow follows its colour. Each pixel's point on the sphere and its light are
// worked out once; a frame only turns the points and colours them.
const orb = talk.firstElementChild.getContext("2d"), size = Math.round(talk.offsetWidth * devicePixelRatio);
orb.canvas.width = orb.canvas.height = size;
const pixels = orb.createImageData(size, size), points = [];  // per pixel: offset, x, y, z, light, shine, alpha
const CALM = [[125, 147, 255], [183, 123, 255], [255, 154, 213]], LISTEN = [[215, 0, 21], [255, 59, 48], [255, 138, 122]],
  WORK = [[76, 29, 222], [140, 52, 255], [217, 70, 239]];
const tilt = 0.35;  // the axis leans toward the viewer, so the turn reads as 3D
for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
  const x = (2 * i + 1) / size - 1, y = (2 * j + 1) / size - 1, r = Math.hypot(x, y);
  if (r >= 1) continue;
  const z = Math.sqrt(1 - r * r);
  const diffuse = Math.max(0, -0.54 * x - 0.74 * y + 0.41 * z);  // lit from the upper left
  const shine = 0.9 * Math.max(0, -0.32 * x - 0.44 * y + 0.84 * z) ** 12 + 0.25 * (1 - z) ** 2;  // highlight, glassy rim
  points.push(4 * (j * size + i), x, y * Math.cos(tilt) - z * Math.sin(tilt), y * Math.sin(tilt) + z * Math.cos(tilt),
    0.82 + 0.28 * diffuse, Math.min(1, shine), Math.min(1, (1 - r) * size / 2) * 255);
}
let angle = 0, speed = 0, colors = CALM, last = performance.now();
const still = matchMedia("(prefers-reduced-motion: reduce)");
(function turn(now) {
  const dt = Math.min(0.1, (now - last) / 1000), state = document.body.classList;
  last = now;
  const goal = state.contains("busy") ? (still.matches ? 1 : 12) : (still.matches ? 0 : 0.3);  // radians per second
  speed += (goal - speed) * (1 - Math.exp(-3 * dt));  // spin up and wind down, never jump
  const palette = state.contains("on") ? LISTEN : state.contains("busy") ? WORK : CALM, fade = 1 - Math.exp(-5 * dt);
  colors = colors.map((c, k) => c.map((v, ch) => v + (palette[k][ch] - v) * fade));  // blend over about half a second
  talk.style.setProperty("--glow", colors[0].map(Math.round).join(" "));
  angle += speed * dt;
  const cos = Math.cos(angle), sin = Math.sin(angle), out = pixels.data;
  const [low, mid, high] = colors;
  for (let k = 0; k < points.length; k += 7) {
    const x = points[k + 1] * cos + points[k + 3] * sin, z = points[k + 3] * cos - points[k + 1] * sin;
    const band = Math.sin(3 * x + 2 * Math.sin(3 * points[k + 2] + 2 * z));  // soft swirls across the surface
    const edge = band < 0 ? low : high, f = Math.abs(band);
    for (let ch = 0; ch < 3; ch++) {
      const c = (mid[ch] + (edge[ch] - mid[ch]) * f) * points[k + 4];
      out[points[k] + ch] = c + (255 - c) * points[k + 5];
    }
    out[points[k] + 3] = points[k + 6];
  }
  orb.putImageData(pixels, 0, 0);
  requestAnimationFrame(turn);
})(last);

// Narration: speak the agent's questions and results, but never over the user. Lines that
// arrive while the mic is open are held and spoken when the user stops, so a confirmation
// question is never lost. The same stream says when the agent is busy, which spins the orb.
let unspoken = [];
const speak = text => speechSynthesis.speak(new SpeechSynthesisUtterance(text));
new EventSource("/narration").onmessage = e => {
  const {say, busy} = JSON.parse(e.data);
  if (busy !== undefined) document.body.classList.toggle("busy", busy);
  if (!say) return;
  says.textContent = say;
  if (stopListening) unspoken.push(say); else speak(say);
};
function speakHeld() { if (unspoken.length) { speak(unspoken.at(-1)); unspoken = []; } }

async function send(text) {
  const r = await post("/segment", {text});
  if (r.error) showError(r.error);
}

let starting = false;
async function start() {
  if (starting) return;      // a double tap must not open a second mic session
  starting = true;
  speechSynthesis.cancel();  // the user is talking: stop speaking at once
  post("/talk");             // barge in on whatever the agent is doing
  let mic;
  try { mic = await navigator.mediaDevices.getUserMedia({audio: mics.value ? {deviceId: {exact: mics.value}} : true}); }
  catch (err) { starting = false; return showError("Microphone blocked: " + err.message); }
  if (!held) { starting = false; return mic.getTracks().forEach(t => t.stop()); }  // let go before the mic opened
  listMics();
  const rec = new MediaRecorder(mic), sock = new WebSocket(`ws://${location.hostname}:__WS_PORT__`);
  let done = "";
  const ctx = new AudioContext(), an = ctx.createAnalyser(), buf = new Uint8Array(512);
  an.fftSize = buf.length;
  ctx.createMediaStreamSource(mic).connect(an);
  (function tick() {
    if (ctx.state === "closed") return talk.style.removeProperty("--lvl");
    an.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += (v - 128) ** 2;
    talk.style.setProperty("--lvl", Math.min(1, Math.sqrt(sum / buf.length) / 30));
    requestAnimationFrame(tick);
  })();
  stopListening = () => rec.state === "recording" ? rec.stop() : sock.close();
  rec.ondataavailable = e => { if (e.data.size && sock.readyState === 1) sock.send(e.data); };
  rec.onstop = () => { if (sock.readyState === 1) sock.send(JSON.stringify({type: "CloseStream"})); };
  sock.onopen = () => {
    starting = false;
    rec.start(100);
    document.body.classList.add("on"); talk.setAttribute("aria-pressed", true); talk.ariaLabel = "Listening";
    said.className = ""; said.textContent = ""; live.textContent = "";
  };
  sock.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type !== "Results") return;
    const words = m.channel.alternatives[0].transcript;
    if (m.is_final && words) done = (done + " " + words).trim();
    if (words) { said.className = ""; said.textContent = done; live.textContent = m.is_final ? "" : words; }
    // Each pause ends a segment: send it now so execution starts while the user keeps talking.
    if (m.speech_final && done) { send(done); done = ""; }
  };
  sock.onclose = e => {
    stopListening = null;
    starting = false;
    if (rec.state !== "inactive") rec.stop();
    mic.getTracks().forEach(t => t.stop());
    ctx.close();
    document.body.classList.remove("on"); talk.setAttribute("aria-pressed", false); talk.ariaLabel = "Hold to talk";
    live.textContent = "";
    speakHeld();
    if (done) send(done);
    if (e.code !== 1000) showError(`Speech service closed (${e.code}). Check the voice server log.`);
  };
}
// Push to talk: listen only while the orb or Space is held, so speech meant for someone else is never acted on.
let held = false;
function press() { if (!held && !stopListening) { held = true; start(); } }
function release() { if (held) { held = false; if (stopListening) stopListening(); } }
talk.onpointerdown = e => { talk.setPointerCapture(e.pointerId); press(); };
talk.onpointerup = talk.onpointercancel = release;
addEventListener("keydown", e => { if (e.code === "Space" && e.target !== mics) { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener("keyup", e => { if (e.code === "Space" && e.target !== mics) release(); });
addEventListener("blur", release);  // the keyup goes to another window
</script>
